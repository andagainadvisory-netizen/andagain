# And Again Advisory  ·  Pathway Session page
# Drop this file at the ROOT of what you deploy (beside the pathway/ folder).

# Functions directory, declared explicitly so manual (drag-and-drop) deploys
# carry the estimator email function as well as git deploys.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/pathway/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/pathway/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pathway/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"

# Clean URL: andagain.ae/pathway
[[redirects]]
  from = "/pathway"
  to = "/pathway/index.html"
  status = 200

# Amharic deep link for the diaspora ad set
[[redirects]]
  from = "/pathway-am"
  to = "/pathway/index.html?lang=am"
  status = 301
